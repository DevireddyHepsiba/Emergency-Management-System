# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=emergency-service
server.port=${SERVER_PORT:8083}

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sentinelos}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.data.mongodb.core=INFO
logging.level.org.springframework.security=INFO
