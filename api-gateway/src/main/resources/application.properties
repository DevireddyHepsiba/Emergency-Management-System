spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

# Route domain APIs to their owning services. Keep the legacy backend as a
# compatibility fallback while remaining /api routes are migrated.
spring.cloud.gateway.server.webflux.routes[0].id=dispatch-recommendations
spring.cloud.gateway.server.webflux.routes[0].uri=${DISPATCH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/emergency/*/recommendations
spring.cloud.gateway.server.webflux.routes[0].order=-10
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=${AUTH_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[2].id=emergency-service
spring.cloud.gateway.server.webflux.routes[2].uri=${EMERGENCY_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/emergency/**
spring.cloud.gateway.server.webflux.routes[3].id=dispatch-ambulances
spring.cloud.gateway.server.webflux.routes[3].uri=${DISPATCH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/hospital/ambulances/**
spring.cloud.gateway.server.webflux.routes[3].order=-5
spring.cloud.gateway.server.webflux.routes[4].id=hospital-service
spring.cloud.gateway.server.webflux.routes[4].uri=${HOSPITAL_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/hospital/**,/api/dashboard/hospital/**
spring.cloud.gateway.server.webflux.routes[5].id=dispatch-service
spring.cloud.gateway.server.webflux.routes[5].uri=${DISPATCH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/rescue/**,/api/dashboard/rescue/**
spring.cloud.gateway.server.webflux.routes[6].id=volunteer-service
spring.cloud.gateway.server.webflux.routes[6].uri=${VOLUNTEER_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/volunteer/**
spring.cloud.gateway.server.webflux.routes[7].id=legacy-backend
spring.cloud.gateway.server.webflux.routes[7].uri=${LEGACY_BACKEND_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/**
