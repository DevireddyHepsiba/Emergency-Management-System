services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  legacy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb://mongo:27017/sentinelos
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/auth-service
    environment: &service-env
      MONGODB_URI: mongodb://mongo:27017/sentinelos
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  emergency-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/emergency-service
    environment:
      <<: *service-env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  hospital-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/hospital-service
    environment:
      <<: *service-env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  dispatch-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/dispatch-service
    environment:
      <<: *service-env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  volunteer-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/volunteer-service
    environment:
      <<: *service-env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: services/ai-service
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE: api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      EMERGENCY_SERVICE_URL: http://emergency-service:8083
      HOSPITAL_SERVICE_URL: http://hospital-service:8084
      DISPATCH_SERVICE_URL: http://dispatch-service:8085
      VOLUNTEER_SERVICE_URL: http://volunteer-service:8086
      LEGACY_BACKEND_URL: http://legacy-backend:8081
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - emergency-service
      - hospital-service
      - dispatch-service
      - volunteer-service
      - legacy-backend
    restart: unless-stopped

volumes:
  mongo-data:
